services:
  web:
    build: .
    image: box-seal-check:latest
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /app/data/verification.db
      SECRET_KEY: please-change-in-production
    volumes:
      - box-seal-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  box-seal-data:
